 if(t<6.2){const u=ease(t/6.2),p=cIn.getPoint(u);setBird(p,cIn.getTangent(u),p.y>9&&p.y<11.6,now);basket.position.copy(p).add(V(0,-HOLD,0));hang(true);for(let i=0;i<4;i++){inBasket(i);pile(i,false,0)}ph=p.y>9.2?'天井の穴から、翼をたたんで飛び込む':(t<1.8?'海の向こうから、籠をつかんで帰ってくる':'中で翼を広げて、吹き抜けを底まで舞い降りる')}
 else{basket.position.copy(PAD);const u=ease((t-6.6)/2.4);if(t<6.6){setBird(V(PAD.x,PAD.y+HOLD,PAD.z),V(0,0,1),false,now);hang(true)}else{setBird(cNest.getPoint(u),cNest.getTangent(Math.min(u,.98)),false,now);hang(false)}
  const sk=cl((t-6.4)/1.1);for(let i=0;i<4;i++){if(sk<=0){inBasket(i);continue}standAt(i,sk);const fk=cl((t-7.8-i*.6)/.55);if(fk<=0){bagOnBack(i);pile(i,false,0)}else{const s=slugs[i],tp=V(T.x+Math.cos(spotA[i])*.75,2.75,T.z+Math.sin(spotA[i])*.75);bags[i].position.lerpVectors(V(s.position.x,2.45,s.position.z),tp,Math.min(1,fk*1.5));bags[i].rotation.set(Math.PI*fk,s.rotation.y,0);pile(i,fk>.6,(fk-.6)/.4)}}
  ph=t<7.6?'籠を下ろして、鳥は巣へ。みんな籠から降りる':(t<10.4?'一人ずつ、自分のバッグを上下ひっくり返して広げる':'みんなで広げた。倒れた理由も地図の上に印で出る')}}
else{
 for(let i=0;i<4;i++)pile(i,false,0);
 if(t<2.2){const u=ease(t/2.2);setBird(cNest.getPoint(1-u),cNest.getTangent(Math.max(.02,1-u)).negate(),false,now);basket.position.copy(PAD);hang(false);for(let i=0;i<4;i++){standAt(i,1);bagOnBack(i)}ph='鳥が巣から、底の籠の所へ下りてくる'}
 else if(t<3.4){setBird(V(PAD.x,PAD.y+HOLD,PAD.z),V(0,0,1),false,now);basket.position.copy(PAD);hang(true);const k=cl((t-2.2)/1);for(let i=0;i<4;i++){if(k>=1)inBasket(i);else{standAt(i,1-k);bagOnBack(i)}}ph='みんな籠に乗る'}
 else{const u=ease((t-3.4)/7),p=cOut.getPoint(u);setBird(p,cOut.getTangent(u),p.y>9&&p.y<11.6,now);basket.position.copy(p).add(V(0,-HOLD,0));hang(true);for(let i=0;i<4;i++)inBasket(i);ph=p.y<9?'籠ごと吹き抜けを上がる：家じゅうの階が見える':(p.y<11.6?'翼をたたんで、天井の穴を抜ける':'海を越えて、島のキャンプへ')}}
$('phase').textContent=ph;$('clk').textContent=Math.min(t,mode=='ret'?11:10.5).toFixed(1)+' 秒'}
function sky(){const t=+$('tod').value,e=Math.sin((t-6)/12*Math.PI),day=Math.max(0,Math.min(1,(e+.15)/.5)),dusk=e>-.3?Math.max(0,1-Math.abs(e)/.3):0,rn=$('rain').checked;
const c=new THREE.Color(0x182233).lerp(new THREE.Color(0xbcd6e6),day);c.lerp(new THREE.Color(0xe7a27c),dusk*.6);if(rn)c.lerp(new THREE.Color(0x8c97a0),.35*day+.1);R.setClearColor(c);
sun.intensity=.1+.75*day*(rn?.6:1);hemi.intensity=.18+.45*day;const a=(t-6)/12*Math.PI;sun.position.set(Math.cos(a)*100,Math.max(Math.sin(a),.05)*100,40);
rainCol.visible=rainL.visible=rn;lightCol.visible=!rn&&day>.3;lightCol.material.opacity=.13*day;
const night=1-day;plM.forEach(l=>l.intensity=lightMode=='M'?.3+1.1*night:0);plO.forEach(l=>l.intensity=lightMode=='O'?.3+1.3*night:0);lampsM.forEach(m=>m.visible=lightMode=='M');lampsO.forEach(m=>m.visible=lightMode=='O');
$('todv').textContent=(t%1?Math.floor(t)+'時半':t+'時')}
$('tod').oninput=sky;$('rain').onchange=sky;
function setMode(m){mode=m;t0=performance.now();$('mRet').classList.toggle('on',m=='ret');$('mDep').classList.toggle('on',m=='dep')}
$('mRet').onclick=()=>setMode('ret');$('mDep').onclick=()=>setMode('dep');
let Vw={tx:-.5,ty:5.2,tz:.5,r:23,th:.85,ph:1.15};const cam=()=>{C.position.set(Vw.tx+Vw.r*Math.sin(Vw.ph)*Math.sin(Vw.th),Vw.ty+Vw.r*Math.cos(Vw.ph),Vw.tz+Vw.r*Math.sin(Vw.ph)*Math.cos(Vw.th));C.lookAt(Vw.tx,Vw.ty,Vw.tz)};
const zoom=f=>{Vw.r=Math.max(4,Math.min(90,Vw.r*f))};$('zin').onclick=()=>zoom(.8);$('zout').onclick=()=>zoom(1.25);
let drag=null;W.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};W.setPointerCapture(e.pointerId);W.style.cursor='grabbing'});W.addEventListener('pointermove',e=>{if(!drag)return;Vw.th-=(e.clientX-drag.x)*.008;Vw.ph=Math.max(.2,Math.min(1.55,Vw.ph-(e.clientY-drag.y)*.006));drag={x:e.clientX,y:e.clientY}});W.addEventListener('pointerup',()=>{drag=null;W.style.cursor='grab'});W.addEventListener('pointercancel',()=>{drag=null});W.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.1:.9)},{passive:false});
function size(){const w=W.clientWidth,h=W.clientHeight;if(!w||!h)return;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix()}new ResizeObserver(size).observe(W);size();
const v3=new THREE.Vector3();function place(){const w=W.clientWidth,h=W.clientHeight;labels.forEach(l=>{v3.copy(l.p).project(C);if(v3.z>1){l.d.hidden=true;return}l.d.hidden=false;l.d.style.left=((v3.x+1)/2*w).toFixed(1)+'px';l.d.style.top=((1-v3.y)/2*h).toFixed(1)+'px'})}
function tick(now){const t=(now-t0)/1000;apply(Math.min(t,mode=='ret'?11:10.5),now);if(rainL.visible){const p=rg.attributes.position;for(let i=0;i<p.count;i+=2){let y=p.getY(i)-.12;if(y<2.6)y=10;p.setY(i,y);p.setY(i+1,y-.5)}p.needsUpdate=true}boat.position.y=.25+Math.sin(now*.0015)*.05;liftTick(now);cam();R.render(S,C);place();requestAnimationFrame(tick)}
sky();requestAnimationFrame(tick);
}catch(e){const el=document.getElementById('err');el.hidden=false;el.textContent='3D を表示できませんでした：'+e.message;}
</script>
