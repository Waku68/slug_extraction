  <div class="tabs" id="tabs"></div>
  <div class="row">
    <button class="btn on" id="vSide">斜めから</button><button class="btn" id="vTop">真上から</button>

  </div>
  <div id="view"><canvas id="cv"></canvas><div id="labels"></div></div>
  <div class="status"><span id="phase"></span><span id="clk"></span></div>
  <p id="err" hidden></p>

    <div class="card"><h2>気になる所</h2><ul id="cons"></ul></div>
  </div>
  <p class="fact" id="fact"></p>
  <div class="legend">
    <span>ドラッグで回す・ホイールで近づく。上が北、海は南。洞窟の殻は透かしてある</span>
    <span class="chip"><span class="sw" style="background:var(--pad)"></span>発着場と籠</span>
    <span class="chip"><span class="sw" style="background:var(--route)"></span>地図の台までの道</span>

</div>
