<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 640" role="img" font-family="sans-serif"><title>島の地図（800 m）</title><desc>800 m の島の地図（Oct 9）。真ん中に段のある岩塩の山、北に火口の丘と黒い溶岩原、西に低い砂漠と赤い台地を割る枯れた谷と岩山、東と南に森、南に花の草原と塩田。区画どうしはどこでも越えられ、崖は短いものがときどき。川の源は溶岩原のふちの泉と、山の南の中腹のたまり池</desc>
